name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        platform: [linux-x86_64, macos-universal2, win-amd64]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # setuptools-scm needs tags for versioning
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install tox shiv build

      - name: Build .pyz for ${{ matrix.platform }}
        env:
          PLATFORM: ${{ matrix.platform }}
        run: tox -e standalone -- "$PLATFORM"

      # .pyz files are not published (they bundle third-party code) but we
      # keep the build as a CI check.  To distribute .pyz files, build
      # locally with: tox -e standalone -- <platform>

  build-python-dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for attestation signing
      attestations: write  # for build provenance attestations
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # setuptools-scm needs tags for versioning
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: python-dist
          path: dist/

  release:
    needs: [build, build-python-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # for uploading release assets
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-dist
          path: dist/

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" dist/* --generate-notes

  verify-release-tag:
    # Best-effort backstop for CWE-862, NOT an authoritative control. Because a
    # `push: tags` workflow runs from the tagged ref itself, an attacker who can
    # craft and push an arbitrary tag can also modify or delete this job in that
    # same commit, so it only blocks the naive case of tagging an existing
    # off-branch commit without touching the workflow. The authoritative controls
    # live outside this tag-controlled file and MUST be configured:
    #   1. A tag ruleset restricting who may create/push `v*` tags.
    #   2. The 'pypi' environment (used by publish-pypi) with required reviewers
    #      and a deployment tag restriction, so a human approves every publish.
    if: github.repository == 'microsoft/pypi-lockdown'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG_NAME: ${{ github.ref_name }}
          TAG_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$TAG_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Refusing to publish: tag $TAG_NAME ($TAG_SHA) is not" \
                 "an ancestor of $DEFAULT_BRANCH. Only commits merged to the" \
                 "default branch may be released."
            exit 1
          fi
          echo "Tag $TAG_NAME ($TAG_SHA) is reachable from $DEFAULT_BRANCH."

  publish-pypi:
    if: github.repository == 'microsoft/pypi-lockdown'
    needs: [release, verify-release-tag]
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # for PyPI trusted publishing (OIDC)
    # The 'pypi' environment is the authoritative publish gate and MUST require
    # reviewers plus a deployment tag restriction limiting it to protected v*
    # tags, so a human approves every publish. The verify-release-tag job above
    # is only a weak backstop (it runs from the tagged ref and so cannot defend
    # against an attacker who crafts the tag commit); it does not replace these
    # environment protections or a tag ruleset.
    environment: pypi
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
